[project]
name = "schwab-agentic-shortener"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
    "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
